<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موعد من iPlan</title>
<meta property="og:title" content="موعد من iPlan">
<meta property="og:description" content="اضغط لإضافة الموعد إلى iPlan أو إلى تقويمك">
<meta property="og:image" content="https://alfarsiomar.github.io/iplan/e/logo.png">
<style>
  :root { --green: #0A3331; --text: #0A3331; --cream: #FFEDD1; --card: #ffffff; --muted: #5b6b6a; --button: #0A3331; }
  @media (prefers-color-scheme: dark) { :root { --text: #ffffff; --cream: #061f1e; --card: #0e3331; --muted: #9fb3b1; --button: #2a9d8f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: -apple-system, system-ui, sans-serif; background: var(--cream); color: var(--text);
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 18px; }
  .card { background: var(--card); border-radius: 24px; padding: 24px 20px; margin: 20px 0; }
  .emoji { font-size: 48px; line-height: 1.2; }
  h1 { font-size: 24px; margin: 8px 0 6px; }
  .when { color: var(--muted); font-size: 17px; }
  a.btn { display: block; text-decoration: none; border-radius: 16px; padding: 15px; font-size: 18px; font-weight: 600; margin-top: 12px; }
  .primary { background: var(--button); color: #fff; }
  .secondary { background: transparent; color: inherit; border: 1.5px solid currentColor; }
  .small { font-size: 14px; color: var(--muted); margin-top: 18px; }
  .small a { color: inherit; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; text-align: start; }
  .item + .item { border-top: 1px solid rgba(127,127,127,.25); }
  .item .ie { font-size: 30px; }
  .item b { display: block; font-size: 18px; }
  .item span { color: var(--muted); font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="iPlan">
  <div class="card" id="card">
    <div class="emoji" id="emoji">📅</div>
    <h1 id="title"></h1>
    <div class="when" id="when"></div>
    <div id="list" hidden></div>
  </div>
  <div id="bad" hidden><p id="badText"></p></div>
  <div id="actions">
    <a class="btn primary" id="open"></a>
    <a class="btn secondary" id="ics" download="event.ics"></a>
    <div class="small" id="get"></div>
  </div>
</div>
<script>
(async function () {
  var ar = !/^en/i.test(navigator.language || "ar");
  if (!ar) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
  var T = ar ? {
    open: "أضف إلى iPlan", ics: "أضف إلى تقويم الجوال", get: "ما عندك iPlan؟ <a href='https://apps.apple.com/app/id6826549893'>حمّله من App Store</a>",
    bad: "الرابط غير مكتمل.", title: "موعد من iPlan"
  } : {
    open: "Add to iPlan", ics: "Add to phone calendar", get: "Don't have iPlan? <a href='https://apps.apple.com/app/id6826549893'>Get it on the App Store</a>",
    bad: "This link is incomplete.", title: "Event from iPlan"
  };
  document.title = T.title;
  var payload = location.hash.slice(1);
  var ev = null;
  try {
    // New links start with "z": the JSON is squeezed with deflate so long lists stay short.
    var packed = payload.charAt(0) === "z";
    var b64 = (packed ? payload.slice(1) : payload).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (packed) {
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    ev = JSON.parse(new TextDecoder().decode(bytes));
    if (ev.k === "o") {
      if (!Array.isArray(ev.l) || !ev.l.length) ev = null;
      // Occasions as [name, yyyymmdd, emoji] in new links; turned into {t, d, e} for the page.
      else ev.l = ev.l.map(function (o) {
        if (!Array.isArray(o)) return o;
        var ymd = o[1], d = new Date(Math.floor(ymd / 10000), Math.floor(ymd / 100) % 100 - 1, ymd % 100, 12);
        return { t: o[0], d: Math.floor(d.getTime() / 1000), e: o[2] || "🎂" };
      });
    }
    else if (typeof ev.d !== "number") ev = null;
  } catch (e) { ev = null; }
  if (!ev) {
    document.getElementById("card").hidden = true;
    document.getElementById("actions").hidden = true;
    document.getElementById("bad").hidden = false;
    document.getElementById("badText").textContent = T.bad;
    return;
  }
  var loc = ar ? "ar-u-nu-latn" : "en";
  // JSON as plain base64url (no squeezing), the form older iPlan versions understand.
  function plain(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function utc(d) { return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
  var esc = function (s) { return String(s).replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;").replace(/\n/g, " "); };
  var ib = document.getElementById("ics");
  var open = document.getElementById("open");
  if (ev.k === "o") {
    // Occasions: a list, added to iPlan or to the phone's calendar every year.
    var one = ev.l.length === 1;
    T.open = ar ? (one ? "أضف المناسبة إلى iPlan" : "أضف المناسبات إلى iPlan") : (one ? "Add to iPlan" : "Add all to iPlan");
    document.title = ar ? (one ? "مناسبة من iPlan" : "مناسبات من iPlan") : "Occasions from iPlan";
    document.getElementById("emoji").hidden = true;
    document.getElementById("title").textContent = document.title;
    var list = document.getElementById("list");
    list.hidden = false;
    var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//iPlan//EN"];
    ev.l.forEach(function (o, n) {
      var d = new Date(o.d * 1000);
      var row = document.createElement("div"); row.className = "item";
      var ie = document.createElement("div"); ie.className = "ie"; ie.textContent = o.e || "🎂";
      var tx = document.createElement("div");
      var b = document.createElement("b"); b.textContent = o.t || "";
      var sp = document.createElement("span"); sp.textContent = d.toLocaleDateString(loc, { day: "numeric", month: "long" });
      tx.appendChild(b); tx.appendChild(sp); row.appendChild(ie); row.appendChild(tx); list.appendChild(row);
      var day = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
      var next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      var dayEnd = next.getFullYear() + String(next.getMonth() + 1).padStart(2, "0") + String(next.getDate()).padStart(2, "0");
      lines.push("BEGIN:VEVENT", "UID:" + o.d + "-" + n + "-" + Math.random().toString(36).slice(2) + "@iplan", "DTSTAMP:" + utc(new Date()),
        "DTSTART;VALUE=DATE:" + day, "DTEND;VALUE=DATE:" + dayEnd, "RRULE:FREQ=YEARLY",
        "SUMMARY:" + esc((o.e ? o.e + " " : "") + (o.t || "")), "END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    open.textContent = T.open;
    // The app gets the first, plain link form, which every iPlan version since 1.3 reads.
    open.href = "iplan://occasion#" + plain({ k: "o", l: ev.l.map(function (o) { return { t: o.t, d: o.d, e: o.e }; }) });
    ib.textContent = T.ics;
    ib.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.join("\r\n"));
    document.getElementById("get").innerHTML = T.get;
    return;
  }
  var date = new Date(ev.d * 1000);
  document.getElementById("emoji").textContent = ev.e || "📅";
  document.getElementById("title").textContent = ev.t || T.title;
  document.getElementById("when").textContent =
    date.toLocaleDateString(loc, { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + " · " +
    date.toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" });
  open.textContent = T.open;
  open.href = "iplan://event#" + plain({ t: ev.t, d: ev.d, e: ev.e });
  var ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//iPlan//EN", "BEGIN:VEVENT",
    "UID:" + ev.d + "-" + Math.random().toString(36).slice(2) + "@iplan", "DTSTAMP:" + utc(new Date()),
    "DTSTART:" + utc(date), "DTEND:" + utc(new Date(date.getTime() + 3600000)),
    "SUMMARY:" + esc((ev.e ? ev.e + " " : "") + (ev.t || "")), "X-IPLAN-EMOJI:" + (ev.e || ""),
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  ib.textContent = T.ics;
  ib.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  document.getElementById("get").innerHTML = T.get;
})();
</script>
</body>
</html>
